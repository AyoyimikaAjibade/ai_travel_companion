# Docker Compose Override for Development
# This file is automatically loaded by docker-compose for development overrides

version: '3.8'

services:
  backend:
    # Override for development with hot reload
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    environment:
      DEBUG: "true"
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    # Expose database port for local development
    ports:
      - "5432:5432"
    # Add development database initialization
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/assets/ai_travel_companion.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Mount local SQL scripts for development
      - ./backend/scripts:/docker-entrypoint-initdb.d/scripts:ro

  # Development tools
  adminer:
    image: adminer
    container_name: ai_travel_adminer
    ports:
      - "8080:8080"
    networks:
      - ai_travel_network
    profiles:
      - dev-tools

  # PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4
    container_name: ai_travel_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    networks:
      - ai_travel_network
    profiles:
      - dev-tools
