name: CI/CD Pipeline - Build & Deploy to LinuxONE VMs

on:
  push:
    branches: [main]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  DOCKER_HUB_REGISTRY: docker.io
  TAG: latest

jobs:
  build-and-push:
    name: Build and Push Docker Images to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-backend:${{ env.TAG }} -f ./Dockerfile .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-backend:${{ env.TAG }}

      - name: Build and push AI service image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-ai-service:${{ env.TAG }} -f ./ai/Dockerfile.ai ./ai
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-ai-service:${{ env.TAG }}

      - name: Verify images pushed
        run: |
          echo "✅ Backend image: ${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-backend:${{ env.TAG }}"
          echo "✅ AI service image: ${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-ai-service:${{ env.TAG }}"

  deploy-to-vms:
    name: Deploy to LinuxONE VMs via SSH
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to each VM
        env:
          VM_IPS: ${{ secrets.VM_IPS }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          IFS=',' read -ra VM_ARRAY <<< "$VM_IPS"

          for VM_IP in "${VM_ARRAY[@]}"; do
            VM_IP=$(echo "$VM_IP" | xargs)
            echo "🚀 Deploying to VM: $VM_IP"

            ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

            # Prepare remote directories and copy compose file and env
            ssh -o StrictHostKeyChecking=no ${SSH_USER}@${VM_IP} "mkdir -p ~/ai-travel-companion/backend/logs ~/ai-travel-companion/backend/uploads"

            scp -o StrictHostKeyChecking=no docker-compose.yml ${SSH_USER}@${VM_IP}:~/ai-travel-companion/docker-compose.yml

            if [ -f .env.example ]; then
              scp -o StrictHostKeyChecking=no .env.example ${SSH_USER}@${VM_IP}:~/ai-travel-companion/.env || true
            fi

            # Perform remote deployment. We pass DOCKER user and tag via env.
            ssh -o StrictHostKeyChecking=no ${SSH_USER}@${VM_IP} "bash -s" <<'DEPLOY_SCRIPT'
              set -euo pipefail
              export DOCKER_USER="${DOCKER_HUB_USERNAME:-}"
              export DOCKER_TOKEN="${DOCKER_HUB_TOKEN:-}"
              export TAG="${TAG:-latest}"

              cd ~/ai-travel-companion || exit 1

              echo "🔐 Logging into Docker Hub..."
              if [ -n "$DOCKER_TOKEN" ] && [ -n "$DOCKER_USER" ]; then
                echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USER" --password-stdin 2>/dev/null || true
              fi

              echo "📦 Update docker-compose.yml to use images from registry (if build blocks exist we convert them to image references)..."
              # Safe replacement: if docker-compose.yml has build for backend/ai_service, replace with image lines.
              # This sed approach assumes 'backend:' and 'ai_service:' top-level service names. For complicated compose files, put a pre-built compose in repo or use a consistent image-only compose for deployment.
              # Replace a build block under backend with image: DOCKER_USER/ai-travel-backend:TAG
              if grep -q 'backend:' docker-compose.yml 2>/dev/null; then
                # remove the 'build:' sub-block for backend (simple heuristic)
                awk '
                BEGIN{svc="";skip=0}
                {
                  if ($0 ~ /^[[:space:]]*backend:/) { svc="backend"; print; next }
                  if ($0 ~ /^[[:space:]]*ai_service:/) { svc="ai_service"; print; next }
                  if (svc=="backend" && $0 ~ /^[[:space:]]*build:/) { skip=1; next }
                  if (skip==1 && $0 ~ /^[[:space:]]*[^[:space:]]/) { skip=0 }
                  if (skip==1) { next }
                  print
                }' docker-compose.yml > docker-compose.tmp && mv docker-compose.tmp docker-compose.yml || true

                # ensure image entry exists
                sed -i "/^[[:space:]]*backend:/{
                  N
                  s/\\(backend:\\)\\([\\s\\S]*?\\)container_name:/\\1\\n    image: ${DOCKER_USER}/ai-travel-backend:${TAG}\\n    container_name:/g
                }" docker-compose.yml || true
              fi

              if grep -q 'ai_service:' docker-compose.yml 2>/dev/null; then
                awk '
                BEGIN{svc="";skip=0}
                {
                  if ($0 ~ /^[[:space:]]*ai_service:/) { svc="ai_service"; print; next }
                  if (svc=="ai_service" && $0 ~ /^[[:space:]]*build:/) { skip=1; next }
                  if (skip==1 && $0 ~ /^[[:space:]]*[^[:space:]]/) { skip=0 }
                  if (skip==1) { next }
                  print
                }' docker-compose.yml > docker-compose.tmp && mv docker-compose.tmp docker-compose.yml || true

                sed -i "/^[[:space:]]*ai_service:/{
                  N
                  s/\\(ai_service:\\)\\([\\s\\S]*?\\)container_name:/\\1\\n    image: ${DOCKER_USER}/ai-travel-ai-service:${TAG}\\n    container_name:/g
                }" docker-compose.yml || true
              fi

              echo "🛑 Stopping existing stack (if any)..."
              docker-compose down || true

              echo "⬇️ Pulling latest images..."
              docker-compose pull || true

              echo "🚀 Starting services..."
              docker-compose up -d --remove-orphans

              echo "⏳ Waiting for services to start..."
              sleep 15

              echo "📊 Service status:"
              docker-compose ps

              if docker-compose ps | grep -q "Up"; then
                echo "✅ Deployment successful!"
              else
                echo "⚠️ Warning: Some services may not be running"
                docker-compose ps
                exit 1
              fi
            DEPLOY_SCRIPT

            echo "✅ Completed deployment to $VM_IP"
            echo ""
          done

          echo "🎉 All deployments completed successfully!"
