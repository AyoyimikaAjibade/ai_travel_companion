name: CI/CD Pipeline - Build & Deploy to LinuxONE VMs

on:
  push:
    branches: [main]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  DOCKER_HUB_REGISTRY: docker.io

jobs:
  build-and-push:
    name: Build and Push Docker Images to Docker Hub
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-backend:latest
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-backend:latest,mode=max

      - name: Build and push AI service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          file: ./ai/Dockerfile.ai
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-ai-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-ai-service:latest
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-ai-service:latest,mode=max

      - name: Verify images pushed
        run: |
          echo "✅ Backend image: ${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-backend:latest"
          echo "✅ AI service image: ${{ secrets.DOCKER_HUB_USERNAME }}/ai-travel-ai-service:latest"

  deploy-to-vms:
    name: Deploy to LinuxONE VMs via SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to each VM
        env:
          VM_IPS: ${{ secrets.VM_IPS }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          IFS=',' read -ra VM_ARRAY <<< "$VM_IPS"
          for VM_IP in "${VM_ARRAY[@]}"; do
            VM_IP=$(echo "$VM_IP" | xargs)
            echo "🚀 Deploying to VM: $VM_IP"
            
            ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
            
            # Create deployment directory on VM
            ssh -o StrictHostKeyChecking=no ${SSH_USER}@${VM_IP} \
              "mkdir -p ~/ai-travel-companion/backend/logs ~/ai-travel-companion/backend/uploads"
            
            # Copy docker-compose.yml to VM
            scp -o StrictHostKeyChecking=no docker-compose.yml ${SSH_USER}@${VM_IP}:~/ai-travel-companion/
            
            # Copy .env.example if it exists
            if [ -f .env.example ]; then
              scp -o StrictHostKeyChecking=no .env.example ${SSH_USER}@${VM_IP}:~/ai-travel-companion/.env 2>/dev/null || true
            fi
            
            # Deploy on VM
            ssh -o StrictHostKeyChecking=no ${SSH_USER}@${VM_IP} bash << DEPLOY_SCRIPT
              set -e
              cd ~/ai-travel-companion
              
              echo "🔐 Logging into Docker Hub..."
              echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin 2>&1 | grep -v "WARNING" || true
              
              echo "📦 Updating docker-compose.yml with image references..."
              
              # Simple Python script to replace build blocks with image references
              BACKEND_IMG="$DOCKER_HUB_USERNAME/ai-travel-backend:latest"
              AI_IMG="$DOCKER_HUB_USERNAME/ai-travel-ai-service:latest"
              
              python3 << PYTHON_EOF
import re

with open('docker-compose.yml', 'r') as f:
    content = f.read()

backend_img = "${BACKEND_IMG}"
ai_img = "${AI_IMG}"

# Replace backend build block
content = re.sub(
    r'(\s+backend:.*?\n)(\s+build:.*?\n\s+context:.*?\n\s+dockerfile:.*?\n)(\s+container_name:)',
    r'\1    image: ' + backend_img + r'\n\3',
    content,
    flags=re.DOTALL
)

# Replace ai_service build block
content = re.sub(
    r'(\s+ai_service:.*?\n)(\s+build:.*?\n\s+context:.*?\n\s+dockerfile:.*?\n)(\s+container_name:)',
    r'\1    image: ' + ai_img + r'\n\3',
    content,
    flags=re.DOTALL
)

with open('docker-compose.yml', 'w') as f:
    f.write(content)

print("✅ docker-compose.yml updated successfully")
PYTHON_EOF
              
              echo "🛑 Stopping existing containers..."
              docker-compose down || true
              
              echo "⬇️ Pulling latest images..."
              docker-compose pull || true
              
              echo "🚀 Starting services..."
              docker-compose up -d --remove-orphans
              
              echo "⏳ Waiting for services to start..."
              sleep 15
              
              echo "📊 Service status:"
              docker-compose ps
              
              if docker-compose ps | grep -q "Up"; then
                echo "✅ Deployment successful!"
              else
                echo "⚠️ Warning: Some services may not be running"
                docker-compose ps
                exit 1
              fi
          DEPLOY_SCRIPT
            
            echo "✅ Completed deployment to $VM_IP"
            echo ""
          done
          
          echo "🎉 All deployments completed successfully!"
